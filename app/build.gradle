apply plugin: 'com.android.application'

repositories {
    //noinspection JcenterRepositoryObsolete
    jcenter {
        content {
            includeVersion "mobi.upod", "time-duration-picker", "1.1.3"
        }
    }
}

def getVersionCode = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'rev-list', '--first-parent', '--count', 'master'
            standardOutput = stdout
        }
        return Integer.parseInt(stdout.toString().trim())
    }
    catch (ignored) {
        return -1;
    }
}

def getVersionName = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'describe', '--tags', '--dirty'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    }
    catch (ignored) {
        return null;
    }
}

// Version of the calculator-disguise release build. Kept independent from the
// upstream git-tag based scheme so releases stay reproducible on any checkout.
def calcVersionCode = Integer.parseInt(
        (project.findProperty('calcVersionCode') ?: '1000').toString())
def calcVersionName = (project.findProperty('calcVersionName') ?: '1.0.0-calc').toString()

// Release signing credentials live ONLY in local.properties (gitignored).
// Without them the release build still succeeds but produces an unsigned APK.
def signingProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { signingProps.load(it) }
}
def calcKeystorePath = signingProps.getProperty('calc.release.keystore')
def calcStorePassword = signingProps.getProperty('calc.release.storePassword')
def calcKeyAlias = signingProps.getProperty('calc.release.keyAlias')
def calcKeyPassword = signingProps.getProperty('calc.release.keyPassword') ?: calcStorePassword
def hasReleaseSigning = calcKeystorePath != null && calcStorePassword != null &&
        calcKeyAlias != null && file(calcKeystorePath).exists()

android {
    compileSdk 35
    buildToolsVersion = '35.0.0'
    defaultConfig {
        applicationId "net.typeblog.shelter"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode getVersionCode()
        versionName getVersionName()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        if (hasReleaseSigning) {
            calcRelease {
                storeFile file(calcKeystorePath)
                storePassword calcStorePassword
                keyAlias calcKeyAlias
                keyPassword calcKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.calcRelease
            }
        }
    }
    applicationVariants.all { variant ->
        if (variant.name == "debug") {
            variant.outputs.each { o -> o.versionCodeOverride = System.currentTimeSeconds() }
        } else if (variant.name == "release") {
            variant.outputs.each { o ->
                o.versionCodeOverride = calcVersionCode
                o.versionNameOverride = calcVersionName
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        disable 'MissingTranslation', 'ExtraTranslation', 'GoogleAppIndexingWarning', 'InvalidFragmentVersionForActivityResult'
    }
    buildFeatures {
        aidl true
    }
    namespace 'net.typeblog.shelter'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.legacy:legacy-support-core-ui:1.0.0'
    implementation 'androidx.fragment:fragment:1.8.4'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    debugImplementation project(path: ':setup-wizard-lib', configuration: 'gingerbreadCompatDebugRuntimeElements')
    releaseImplementation project(path: ':setup-wizard-lib', configuration: 'gingerbreadCompatReleaseRuntimeElements')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.0-alpha04'
    androidTestImplementation 'androidx.test:espresso:espresso-core:3.6.0-alpha01'
}

// Workaround for a Windows-only AIDL issue:
// aidl.exe embeds its raw command line (with backslashes) in the header comment
// of the generated .java files. javac then treats "\U" (from "\Users\...")
// as the start of a Unicode escape and fails with "illegal Unicode escape".
// Normalize that single comment line to use forward slashes after each AIDL run.
afterEvaluate {
    tasks.matching { it.name.startsWith('compile') && it.name.endsWith('Aidl') }.configureEach {
        doLast {
            def aidlOut = new File(buildDir, 'generated/aidl_source_output_dir')
            if (!aidlOut.isDirectory()) return
            aidlOut.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                if (!f.name.endsWith('.java')) return
                def text = f.getText('UTF-8')
                def fixed = text.replaceAll(/(?m)^ \* Using:.*$/) { it.replace('\\', '/') }
                if (fixed != text) f.setText(fixed, 'UTF-8')
            }
        }
    }
}
